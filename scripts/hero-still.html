<!doctype html>
<!-- Capture page for public/images/hero-scene.webp (see scripts/render-hero-still.mjs). Renders the live hero
     scene once, at rest, on the page background. Served by the Vite dev server; never deployed. -->
<html>
<head>
  <meta charset="UTF-8" />
  <style>
    html, body { margin: 0; background: #FAF9F6; overflow: hidden; }
    #host { position: absolute; inset: 0; }
    #host canvas { width: 100%; height: 100%; display: block; }
    /* Same look as .sys-label in src/components/Hero3D.vue (scoped there, so repeated here). */
    .sys-label {
      position: absolute; z-index: 1; translate: -50% -140%; white-space: nowrap; font: 500 16px/1 Inter, system-ui, sans-serif;
      letter-spacing: .1em; text-transform: uppercase; padding: 6px 14px; border-radius: 999px;
      background: rgb(250 249 246 / .9); border: 1px solid rgb(28 27 24 / .12); color: #1C1B18;
    }
  </style>
</head>
<body>
  <section id="section" style="height: 900px">
    <div id="host"><span class="sys-label">API</span><span class="sys-label">Database</span><span class="sys-label">ERP</span></div>
  </section>
  <script type="module">
    import { initHero3D } from '/src/hero3d.js'
    initHero3D(document.getElementById('host'), document.getElementById('section'), { settled: true })
  </script>
</body>
</html>
